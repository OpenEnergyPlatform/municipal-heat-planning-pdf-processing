# Read the Docs builds the pages that scripts/build_docs.py generates.
#
# It does NOT run the generator: the pages are checked in, and
# tests/test_docs_build.py fails when a checked-in page and a fresh render
# disagree. So the build here is a pure Sphinx run over Markdown that is
# already in the tree, and it needs neither the GPU stack nor the corpus.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
