# The documentation build as a check, on every push to develop, every tag
# and every pull request that touches a documented source: the checked-in
# pages must be a fresh render, and Sphinx must build them without a warning,
# because that is exactly how Read the Docs builds them (.readthedocs.yaml,
# fail_on_warning). A page that would break the site fails here first, on
# the commit that broke it.
#
# Hosting and versions are Read the Docs': it builds on its own webhook and
# keeps one version per branch and tag. Nothing is published from here.
name: docs

on:
  push:
    branches: [develop]
    tags: ["v*"]
  pull_request:
    paths:
      - "docs/**"
      - "docpipe/**"
      - "profiles/**"
      - "scripts/build_docs.py"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: python -m pip install -r docs/requirements.txt
      - name: The checked-in pages are a fresh render
        run: python scripts/build_docs.py --check
      - name: Sphinx, warnings are errors
        run: python -m sphinx -W --keep-going -b html docs _build/html
