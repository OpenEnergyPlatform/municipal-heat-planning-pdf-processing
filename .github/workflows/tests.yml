# The test suite on every pull request and on every push to develop. No GPU,
# no model and no secret: the tests ask a stub where a stage asks a model, and
# tests/conftest.py stands in for the libraries that are not installed.
#
# Two installations, because both are what somebody runs: the light one the
# suite is written against, and the package as `pip install` delivers it.
name: tests

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  light:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: >
          python -m pip install pytest PyYAML numpy Pillow jsonschema rdflib
          requests tqdm pandas openpyxl "tomli; python_version < '3.11'"
      - run: python -m pytest tests -q -p no:cacheprovider

  installed:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ".[dev]"
      # From outside the checkout, so what runs is the installed package:
      # the first steps of somebody who has only installed it.
      - run: |
          mkdir "$RUNNER_TEMP/demo" && cd "$RUNNER_TEMP/demo"
          docpipe --version
          docpipe --help
          docpipe init
          docpipe profiles
          docpipe doctor --offline
      # Every recorded harvest the repository holds, made again from its
      # recorded answers and held against the first one (docpipe benchmark).
      # Also from outside the checkout: the harvest a benchmark starts runs
      # the package the command itself runs, which is then the installed
      # one. A benchmark names a profile of this repository by its
      # directory ("profile": "../../profiles/kwp").
      - run: |
          cd "$RUNNER_TEMP"
          for described in "$GITHUB_WORKSPACE"/benchmarks/*/benchmark.json; do
            [ -f "$described" ] || continue
            docpipe benchmark "$(dirname "$described")"
          done
