# The pipeline image (docker/Containerfile) on every push to production:
# built, its test suite run inside it without network, and only then pushed
# to ghcr.io as <repository>:<commit> and <repository>:production.
name: image

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      # The vLLM base image alone is 12 GB compressed. Docker moves to the
      # runner's larger disk, and the preinstalled toolchains go.
      - name: Make room for the image
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker system prune --all --force
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt
      - uses: actions/checkout@v4
      - name: Build
        run: >
          docker build -f docker/Containerfile
          --build-arg REVISION=${{ github.sha }} -t docpipe:ci .
      # The base image ships its own top-level `tests` package, so the repo's
      # tests/ is pinned before pytest imports it. The docs build is not in
      # the image.
      - name: Test suite inside the image
        run: |
          docker run --rm --network none -e DOCPIPE_PROFILE=kwp docpipe:ci python3 -c "
          import sys, types, pytest
          pinned = types.ModuleType('tests')
          pinned.__path__ = ['tests']
          sys.modules['tests'] = pinned
          sys.exit(pytest.main(['tests', '-q', '-p', 'no:cacheprovider',
                                '--ignore=tests/test_docs_build.py']))
          "
      - name: Push to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for tag in "${GITHUB_SHA::12}" "${GITHUB_REF_NAME}"; do
            docker tag docpipe:ci "$image:$tag"
            docker push "$image:$tag"
          done
          docker images "$image"
