# The pipeline image (docker/Containerfile) on every push to production:
# built, its test suite run inside it without network, and only then pushed
# as <commit> and production: to Docker Hub as <user>/docpipe, with user and
# token from the `dockerhub` environment, and to ghcr.io as <repository>.
name: image

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # Limited to production in the repository settings, so no workflow on
    # another branch can read the Docker Hub token.
    environment: dockerhub
    steps:
      # The vLLM base image alone is 12 GB compressed. Docker moves to the
      # runner's larger disk, and the preinstalled toolchains go.
      - name: Make room for the image
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker system prune --all --force
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt
      - uses: actions/checkout@v7
      - name: Build
        run: >
          docker build -f docker/Containerfile
          --build-arg REVISION=${{ github.sha }} -t docpipe:ci .
      # First, because the ghcr.io package cannot be made public.
      - name: Push to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "DOCKERHUB_TOKEN is not set, skipping Docker Hub."
            exit 0
          fi
          echo "$DOCKERHUB_TOKEN" \
            | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          image="docker.io/${DOCKERHUB_USERNAME}/docpipe"
          for tag in "${GITHUB_SHA::12}" "${GITHUB_REF_NAME}"; do
            docker tag docpipe:ci "$image:$tag"
            docker push "$image:$tag"
          done
          docker logout docker.io
      - name: Push to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for tag in "${GITHUB_SHA::12}" "${GITHUB_REF_NAME}"; do
            docker tag docpipe:ci "$image:$tag"
            docker push "$image:$tag"
          done
          docker images "$image"
