# The editor (`docpipe edit`) on every push and pull request that touches it:
# installed from the package's own lists (pyproject.toml, `.[editor,dev]`),
# its page built from docpipe/editor/ui with the Node package.json names,
# and the built page compared with the one committed (a source changed
# without a build fails here, as it fails tests/test_editor_page_built.py).
# Then the editor's tests and the test that every library the package
# imports is declared.
name: editor

on:
  push:
    branches: [develop, production]
    paths:
      - "docpipe/**"
      - "profiles/**"
      - "tests/test_editor_*.py"
      - "tests/test_declared_libraries.py"
      - "scripts/build_editor_page.py"
      - "pyproject.toml"
      - ".github/workflows/editor.yml"
  pull_request:
    paths:
      - "docpipe/**"
      - "profiles/**"
      - "tests/test_editor_*.py"
      - "tests/test_declared_libraries.py"
      - "scripts/build_editor_page.py"
      - "pyproject.toml"
      - ".github/workflows/editor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docpipe/editor/ui/package-lock.json
      - name: Install docpipe with the editor's lists
        run: python -m pip install -e ".[editor,dev]"
      - name: Build the page from its sources
        run: python scripts/build_editor_page.py --install
      - name: The committed page is that build
        run: git diff --exit-code -- docpipe/editor/web
      - name: The editor's tests
        run: >
          python -m pytest -q -p no:cacheprovider --tb=short
          tests/test_declared_libraries.py tests/test_editor_page_built.py
          tests/test_editor_*.py
